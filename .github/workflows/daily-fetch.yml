name: Daily News Fetch

on:
  schedule:
    - cron: '0 5 * * *' # 5:00 AM UTC every day
  workflow_dispatch: {} # lets you trigger a manual test run from the Actions tab

jobs:
  fetch-and-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - run: npm ci

      - name: Research and summarize today's briefs
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          TAVILY_API_KEY: ${{ secrets.TAVILY_API_KEY }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: node scripts/fetch-news.js

      - name: Trigger Cloudflare rebuild
        run: curl -fsS -X POST "${{ secrets.CLOUDFLARE_DEPLOY_HOOK_URL }}"

      - name: Wait for Cloudflare deploy to go live

        run: sleep 90

      - name: Submit updated URLs to IndexNow
        run: node scripts/submit-indexnow.js
        env:
          INDEXNOW_KEY: ${{ secrets.INDEXNOW_KEY }}