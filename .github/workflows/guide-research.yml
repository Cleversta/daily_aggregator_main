name: Guide research queue
on:
  schedule:
    - cron: '15 */6 * * *'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: guide-research
  cancel-in-progress: false
jobs:
  research:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: node scripts/process-guide-jobs.mjs
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          TAVILY_GUIDE_API_KEY: ${{ secrets.TAVILY_GUIDE_API_KEY }}
          GEMINI_GUIDE_API_KEY: ${{ secrets.GEMINI_GUIDE_API_KEY }}
          TAVILY_API_KEY: ${{ secrets.TAVILY_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GUIDE_GEMINI_MODEL: ${{ vars.GUIDE_GEMINI_MODEL }}
          GUIDE_TAVILY_MONTHLY_LIMIT: ${{ vars.GUIDE_TAVILY_MONTHLY_LIMIT }}
          GUIDE_GEMINI_DAILY_LIMIT: ${{ vars.GUIDE_GEMINI_DAILY_LIMIT }}
          GUIDE_AUTO_REVIEW: ${{ vars.GUIDE_AUTO_REVIEW }}
